<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-version" content="1.0.0">
  <meta name="description" content="Вход в Родной Агент: сессии, баланс, история запросов, админские настройки и ссылки на юридические страницы.">
  <title>Вход — Родной Агент</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="stylesheet" href="/static/styles.css?v=1.0.0">
</head>
<body class="auth-page" data-auth-page="login">
<main class="auth-shell">
  <section class="auth-card">
    <button class="locale-toggle" id="localeToggle" type="button" aria-label="Switch language">EN</button>
    <a class="auth-brand" href="/">
      <span class="brand-mark">PA</span>
      <span>
        <strong class="localized-brand">Родной Агент</strong>
        <small class="localized-edition">Локальная версия</small>
      </span>
    </a>
    <span class="eyebrow">АККАУНТ</span>
    <h1>Войти</h1>
    <p>Вход нужен для многопользовательского режима, баланса, истории запросов и админских настроек.</p>
    <form id="authForm">
      <label>
        Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Пароль
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="token-toggle">
        <input id="rememberMe" type="checkbox">
        Запомнить меня на этом устройстве
      </label>
      <button class="primary-button" type="submit">Войти</button>
    </form>
    <p id="authError" class="error" role="alert"></p>
    <p id="authSuccess" class="success-text"></p>
    <div class="auth-links">
      <a href="/register">Создать аккаунт</a>
      <a href="/">← В Родной Агент</a>
    </div>
    <div class="legal-links">
      <a href="/terms">Пользовательское соглашение</a>
      <a href="/privacy">Политика конфиденциальности</a>
      <a href="/cookies">Cookies</a>
      <a href="/disclaimer">Дисклеймер</a>
    </div>
  </section>
</main>
<script src="/static/auth.js?v=1.0.0"></script>
</body>
</html>
