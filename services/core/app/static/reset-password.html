<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-version" content="1.0.3">
  <meta name="description" content="Смена пароля аккаунта Родного Агента по ссылке восстановления.">
  <title>Новый пароль — Родной Агент</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="stylesheet" href="/static/styles.css?v=1.0.3">
</head>
<body class="auth-page" data-auth-page="reset-password">
<main class="auth-shell">
  <section class="auth-card">
    <button class="locale-toggle" id="localeToggle" type="button" aria-label="Switch language">EN</button>
    <a class="auth-brand" href="/">
      <span class="brand-mark">PA</span>
      <span>
        <strong class="localized-brand">Родной Агент</strong>
        <small class="localized-edition">Версия</small>
      </span>
    </a>
    <span class="eyebrow">АККАУНТ</span>
    <h1 id="resetTitle">Новый пароль</h1>
    <p id="resetLead">Укажите новый пароль для аккаунта. Ссылка действует ограниченное время.</p>
    <div id="tokenState" class="info-callout">Проверяю ссылку…</div>
    <form id="authForm" hidden>
      <label>
        Новый пароль
        <input id="password" type="password" autocomplete="new-password" minlength="10" required placeholder="Минимум 10 символов">
      </label>
      <button class="primary-button" type="submit">Сохранить новый пароль</button>
    </form>
    <p id="authError" class="error" role="alert"></p>
    <p id="authSuccess" class="success-text"></p>
    <div class="auth-links">
      <a href="/login">Вернуться ко входу</a>
      <a href="/">← В Родной Агент</a>
    </div>
  </section>
</main>
<script src="/static/auth.js?v=1.0.3"></script>
</body>
</html>
